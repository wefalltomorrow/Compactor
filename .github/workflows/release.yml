name: Release

on:
  push:
    branches: [ "master" ]

permissions:
  contents: write
  pull-requests: read

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    if: github.event.head_commit.message == 'Publish v0.11.4'
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Verify release target
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $releaseSha = (git rev-parse HEAD^).Trim()
          $expectedSha = 'a39b60041f5fa2f130f78279084e4f2d39bf766f'
          if ($releaseSha -ne $expectedSha) {
            throw "Unexpected release target: $releaseSha"
          }

          $pullRequests = gh pr list `
            --repo $env:GITHUB_REPOSITORY `
            --base master `
            --state open `
            --json number,title,isDraft | ConvertFrom-Json

          $blocking = @($pullRequests | Where-Object { -not $_.isDraft })
          if ($blocking.Count -gt 0) {
            throw 'Release blocked by open non-draft pull requests targeting master.'
          }

          git checkout --detach $releaseSha
          "VERSION=0.11.4" >> $env:GITHUB_ENV
          "TAG=v0.11.4" >> $env:GITHUB_ENV
          "RELEASE_SHA=$releaseSha" >> $env:GITHUB_ENV

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Verify version and changelog
        shell: pwsh
        run: |
          $match = Select-String -Path Cargo.toml -Pattern '^version = "([^"]+)"' | Select-Object -First 1
          if (-not $match -or $match.Matches[0].Groups[1].Value -ne $env:VERSION) {
            throw 'Cargo.toml version does not match v0.11.4.'
          }

          $lines = Get-Content CHANGELOG.md
          $heading = "## [$env:VERSION]"
          $start = -1
          for ($i = 0; $i -lt $lines.Count; $i++) {
            if ($lines[$i].StartsWith($heading)) {
              $start = $i
              break
            }
          }
          if ($start -lt 0) {
            throw "CHANGELOG.md does not contain an entry for $env:VERSION."
          }

          $end = $lines.Count
          for ($i = $start + 1; $i -lt $lines.Count; $i++) {
            if ($lines[$i].StartsWith('## ')) {
              $end = $i
              break
            }
          }

          $notes = $lines[($start + 1)..($end - 1)] -join "`n"
          $notes = $notes.Trim()
          if (-not $notes) {
            throw "The changelog entry for $env:VERSION is empty."
          }
          Set-Content -Path release-notes.md -Value $notes -Encoding utf8

      - name: Validate embedded JavaScript
        run: node --check src/ui/app.js

      - name: Build release x64
        run: cargo build --release --locked --target x86_64-pc-windows-msvc

      - name: Run tests
        run: cargo test --release --locked --target x86_64-pc-windows-msvc

      - name: Create tag
        shell: pwsh
        run: |
          git fetch --tags
          git rev-parse $env:TAG 2>$null
          if ($LASTEXITCODE -eq 0) {
            throw "$env:TAG already exists."
          }

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a $env:TAG $env:RELEASE_SHA -m "Compactor $env:TAG"
          git push origin $env:TAG

      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view $env:TAG --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            throw "A GitHub Release already exists for $env:TAG."
          }

          gh release create $env:TAG `
            "target/x86_64-pc-windows-msvc/release/Compactor.exe" `
            --repo $env:GITHUB_REPOSITORY `
            --title "Compactor $env:TAG" `
            --notes-file release-notes.md `
            --verify-tag
