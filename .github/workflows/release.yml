name: Release

on:
  push:
    branches: [ "master" ]

permissions:
  contents: write
  pull-requests: read

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    if: github.event.head_commit.message == 'Start v0.11.4 release'
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Verify release state
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ($env:GITHUB_REF_NAME -ne 'master') {
            throw 'Releases must run from master.'
          }

          $currentCommit = (git rev-parse HEAD).Trim()
          $remoteMaster = ((git ls-remote origin refs/heads/master) -split "`t")[0].Trim()
          if ($currentCommit -ne $remoteMaster) {
            throw 'Master changed after this release run started.'
          }

          $pullRequests = gh pr list `
            --repo $env:GITHUB_REPOSITORY `
            --base master `
            --state open `
            --json number,title,isDraft | ConvertFrom-Json

          $blocking = @($pullRequests | Where-Object { -not $_.isDraft })
          if ($blocking.Count -gt 0) {
            Write-Host 'Open pull requests must be merged or converted to draft before a release:'
            foreach ($pr in $blocking) {
              Write-Host "  #$($pr.number) $($pr.title)"
            }
            throw 'Release blocked by open pull requests targeting master.'
          }

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Prepare v0.11.4 commit
        shell: pwsh
        run: |
          $oldVersion = '0.11.3'
          $version = '0.11.4'

          $cargoPath = (Resolve-Path Cargo.toml).Path
          $cargo = [System.IO.File]::ReadAllText($cargoPath)
          $oldLine = "version = `"$oldVersion`""
          $newLine = "version = `"$version`""
          if (-not $cargo.Contains($oldLine)) {
            throw "Cargo.toml does not contain $oldLine"
          }
          $cargo = $cargo.Replace($oldLine, $newLine)
          [System.IO.File]::WriteAllText($cargoPath, $cargo, [System.Text.UTF8Encoding]::new($false))

          # Keep the known-good lockfile format and dependency set unchanged. Only
          # update the workspace package version; a fresh locked build below proves
          # the edited lockfile is accepted by Cargo.
          $lockPath = (Resolve-Path Cargo.lock).Path
          $lock = [System.IO.File]::ReadAllText($lockPath)
          $pattern = '(\[\[package\]\]\r?\nname = "compactor"\r?\nversion = ")0\.11\.3(")'
          $updatedLock = [regex]::Replace($lock, $pattern, '${1}0.11.4${2}', 1)
          if ($updatedLock -eq $lock) {
            throw 'Could not update the Compactor package version in Cargo.lock.'
          }
          [System.IO.File]::WriteAllText($lockPath, $updatedLock, [System.Text.UTF8Encoding]::new($false))

          $lockChanges = @(git diff --unified=0 -- Cargo.lock | Where-Object {
            ($_ -match '^[+-]') -and ($_ -notmatch '^---') -and ($_ -notmatch '^\+\+\+')
          })
          if ($lockChanges.Count -ne 2 -or
              $lockChanges[0] -ne '-version = "0.11.3"' -or
              $lockChanges[1] -ne '+version = "0.11.4"') {
            Write-Host 'Unexpected Cargo.lock changes:'
            git diff -- Cargo.lock
            throw 'Cargo.lock changed by more than the local package version.'
          }

          if (-not (Select-String -Path CHANGELOG.md -SimpleMatch '## [0.11.4]' -Quiet)) {
            throw 'CHANGELOG.md does not contain a v0.11.4 entry.'
          }

          # Restore the normal manual-only release workflow in the actual release commit.
          git checkout HEAD^ -- .github/workflows/release.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.toml Cargo.lock .github/workflows/release.yml
          git commit -m "Release v0.11.4"
          git push origin HEAD:master

          $releaseSha = (git rev-parse HEAD).Trim()
          "VERSION=$version" >> $env:GITHUB_ENV
          "TAG=v$version" >> $env:GITHUB_ENV
          "RELEASE_SHA=$releaseSha" >> $env:GITHUB_ENV

      - name: Verify changelog entry
        shell: pwsh
        run: |
          $lines = Get-Content CHANGELOG.md
          $heading = "## [$env:VERSION]"
          $start = -1

          for ($i = 0; $i -lt $lines.Count; $i++) {
            if ($lines[$i].StartsWith($heading)) {
              $start = $i
              break
            }
          }

          if ($start -lt 0) {
            throw "CHANGELOG.md does not contain an entry for $env:VERSION."
          }

          $end = $lines.Count
          for ($i = $start + 1; $i -lt $lines.Count; $i++) {
            if ($lines[$i].StartsWith('## ')) {
              $end = $i
              break
            }
          }

          $notes = $lines[($start + 1)..($end - 1)] -join "`n"
          $notes = $notes.Trim()
          if (-not $notes) {
            throw "The changelog entry for $env:VERSION is empty."
          }

          Set-Content -Path release-notes.md -Value $notes -Encoding utf8

      - name: Build release x64
        run: cargo build --release --locked --target x86_64-pc-windows-msvc

      - name: Run tests
        run: cargo test --release --locked --target x86_64-pc-windows-msvc

      - name: Verify release commit
        shell: pwsh
        run: |
          $remoteMaster = ((git ls-remote origin refs/heads/master) -split "`t")[0].Trim()
          if ($remoteMaster -ne $env:RELEASE_SHA) {
            throw 'Master changed after the release commit was prepared.'
          }

      - name: Create tag
        shell: pwsh
        run: |
          git fetch --tags
          git rev-parse $env:TAG 2>$null
          if ($LASTEXITCODE -eq 0) {
            throw "$env:TAG already exists."
          }

          git tag -a $env:TAG $env:RELEASE_SHA -m "Compactor $env:TAG"
          git push origin $env:TAG

      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view $env:TAG --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            throw "A GitHub Release already exists for $env:TAG."
          }

          gh release create $env:TAG `
            "target/x86_64-pc-windows-msvc/release/Compactor.exe" `
            --repo $env:GITHUB_REPOSITORY `
            --title "Compactor $env:TAG" `
            --notes-file release-notes.md `
            --verify-tag
