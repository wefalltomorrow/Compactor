name: Apply folder-only compressed view

on:
  push:
    branches: [ "folder-only-compressed-view" ]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  patch:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Apply folder-only viewer changes
        run: python tools/apply_folder_only_view.py

      - name: Validate embedded JavaScript
        run: node --check src/ui/app.js

      - name: Build release x64
        run: cargo build --release --locked --target x86_64-pc-windows-msvc

      - name: Run tests
        run: cargo test --release --locked --target x86_64-pc-windows-msvc

      - name: Remove temporary patch files
        shell: pwsh
        run: |
          Remove-Item tools/apply_folder_only_view.py
          Remove-Item .github/workflows/apply-folder-only-view.yml

      - name: Commit viewer changes
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) {
            Write-Host "No changes to commit."
            exit 0
          }
          git commit -m "Simplify compressed viewer to folders only"
          git push
