name: Windows x64 build

on:
  push:
    branches: [ "master", "best-of-compactor" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Build release x64
        run: cargo build --release --locked --target x86_64-pc-windows-msvc

      - name: Run tests
        run: cargo test --release --locked --target x86_64-pc-windows-msvc

      - name: Upload Compactor x64
        uses: actions/upload-artifact@v4
        with:
          name: Compactor-x64
          path: target/x86_64-pc-windows-msvc/release/Compactor.exe
          if-no-files-found: error
          retention-days: 7
