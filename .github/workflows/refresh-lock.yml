name: Refresh Cargo lockfile

on:
  push:
    branches: [ "release-0.11.1" ]

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: windows-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v7

      - name: Update package version only
        shell: pwsh
        run: |
          $content = Get-Content Cargo.lock -Raw
          $pattern = '(?ms)(\[\[package\]\]\r?\nname = "compactor"\r?\nversion = ")0\.11\.0(")'
          if ($content -match '(?ms)\[\[package\]\]\r?\nname = "compactor"\r?\nversion = "0\.11\.1"') {
            Write-Host 'Cargo.lock already contains version 0.11.1.'
            exit 0
          }
          $updated = [regex]::Replace($content, $pattern, '${1}0.11.1$2', 1)
          if ($updated -eq $content) {
            throw 'Could not update the Compactor package version in Cargo.lock.'
          }
          Set-Content Cargo.lock -Value $updated -NoNewline

      - name: Commit lockfile
        shell: pwsh
        run: |
          if (-not (git status --porcelain -- Cargo.lock)) {
            Write-Host 'No lockfile change to commit.'
            exit 0
          }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock
          git commit -m "Update lockfile for v0.11.1"
          git push
