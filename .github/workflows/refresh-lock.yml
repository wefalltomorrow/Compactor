name: Refresh Cargo lockfile

on:
  push:
    branches: [ "release-0.11.1" ]

permissions:
  contents: read

jobs:
  lockfile:
    runs-on: windows-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v7

      - name: Update package version only
        shell: pwsh
        run: |
          $content = Get-Content Cargo.lock -Raw
          $pattern = '(?ms)(\[\[package\]\]\r?\nname = "compactor"\r?\nversion = ")0\.11\.0(")'
          $updated = [regex]::Replace($content, $pattern, '${1}0.11.1$2', 1)
          if ($updated -eq $content) {
            throw 'Could not update the Compactor package version in Cargo.lock.'
          }
          Set-Content Cargo.lock -Value $updated -NoNewline

      - name: Upload lockfile
        uses: actions/upload-artifact@v7
        with:
          name: Cargo-lock
          path: Cargo.lock
          if-no-files-found: error
          retention-days: 1
