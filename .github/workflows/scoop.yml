name: Update Scoop manifest

on:
  schedule:
    - cron: '30 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - name: Update manifest
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./.github/scripts/update-scoop-manifest.ps1

      - name: Commit manifest
        run: |
          if git diff --quiet -- bucket/compactor.json; then
            exit 0
          fi
          version=$(jq -r .version bucket/compactor.json)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bucket/compactor.json
          git commit -m "Update Scoop manifest to $version"
          git push
