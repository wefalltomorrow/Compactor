name: Fix in-app viewer JavaScript

on:
  push:
    branches: [ "in-app-compressed-viewer" ]

permissions:
  contents: write

jobs:
  fix:
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Fix literal tab escapes
        shell: pwsh
        run: |
          $path = 'src/ui/app.js'
          $text = [System.IO.File]::ReadAllText($path)
          $text = $text.Replace('\t', "`t")
          [System.IO.File]::WriteAllText($path, $text, [System.Text.UTF8Encoding]::new($false))

      - name: Validate JavaScript
        run: node --check src/ui/app.js

      - name: Remove temporary workflow
        shell: pwsh
        run: Remove-Item .github/workflows/fix-in-app-viewer-js.yml -Force

      - name: Commit fix
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) {
            throw 'No JavaScript fix was produced.'
          }
          git commit -m "Fix in-app viewer JavaScript"
          git push origin HEAD:in-app-compressed-viewer
