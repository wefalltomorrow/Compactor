name: Bump v0.11.2 lockfile

on:
  push:
    branches: [ "release-v0.11.2" ]

permissions:
  contents: write

jobs:
  bump:
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7
        with:
          ref: release-v0.11.2

      - name: Update Compactor package version in lockfile
        run: python scripts/bump-lock-v0.11.2.py

      - name: Commit lockfile
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock
          git commit -m "Update lockfile for v0.11.2"
          git push origin HEAD:release-v0.11.2
