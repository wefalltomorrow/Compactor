name: Apply final performance pass v2

on:
  push:
    branches: [ "final-performance-pass-v2" ]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Apply performance changes
        run: python .github/patch-final-performance-v2.py

      - name: Validate embedded JavaScript
        run: node --check src/ui/app.js

      - name: Build release x64
        run: cargo build --release --locked --target x86_64-pc-windows-msvc

      - name: Run tests
        run: cargo test --release --locked --target x86_64-pc-windows-msvc

      - name: Remove temporary patch files
        shell: pwsh
        run: |
          git rm .github/patch-final-performance-v2.py
          git rm .github/workflows/apply-final-performance-v2.yml

      - name: Commit performance changes
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Optimize hardware-aware analysis and compression"
          git push origin HEAD:final-performance-pass-v2
