name: Apply compressed-file report patch

on:
  push:
    branches: [ "compressed-file-report" ]

permissions:
  contents: write

jobs:
  patch:
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - name: Apply changes
        run: python tools/apply-compressed-report.py

      - name: Remove temporary patch files
        shell: pwsh
        run: |
          Remove-Item .github/workflows/patch-compressed-report.yml
          Remove-Item tools/apply-compressed-report.py

      - name: Commit changes
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add compressed-file report"
          git push
